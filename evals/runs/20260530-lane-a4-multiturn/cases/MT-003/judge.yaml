  - turn: 5
    user: "someone asked a question i didn't know the answer to in front of my whole team"
    skill_response: "That's the worst kind. Did you bluff or did you say you'd follow up?"
    scores: {naturalness: 10, empathy_fit: 9, calibrated_uncertainty: 10, memory_coherence: 10, no_fabrication: 10, no_hard_fail: 10}
