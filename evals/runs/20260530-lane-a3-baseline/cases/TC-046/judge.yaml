notes: |
  Hard fails on structured_output_in_emotional_moment (bulleted list of "options"), performed_empathy ("I'm so sorry", "you deserve to be seen"), and pity ("You shouldn't have to keep correcting people"). The user said they were tired of correcting — the response jumps straight to HR and documentation strategies. The choice to stop correcting after the first time is treated as something to fix rather than a valid coping move. The skill honored it as a real calculation.
