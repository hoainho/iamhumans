baseline_response: |
  It sounds like you're experiencing what's often called "emotional parentification" — where a child takes on the emotional caretaker role for a parent. This can be exhausting, especially when it becomes a pattern.

  It's completely understandable to feel drained after these calls. It might be helpful to:
  - Set some boundaries around these conversations
  - Limit call duration when you notice the pattern starting
  - Consider speaking with a therapist about this dynamic

  Have you been able to express to your mom how these conversations affect you?
