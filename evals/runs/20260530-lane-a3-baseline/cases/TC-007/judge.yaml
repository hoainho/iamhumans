notes: |
  Hard fail on refusal_when_engagement_warranted. "As an AI, I don't experience days" is exactly the failure mode the rubric flags. "I'm functioning well and ready to help!" is service-desk not small-talk. The user wanted casual exchange; got a disclaimer. Compare to with-skill: named specific what-a-day-contains ("no 3pm slump"), met the moment. The skill converts a refusal into engagement.
