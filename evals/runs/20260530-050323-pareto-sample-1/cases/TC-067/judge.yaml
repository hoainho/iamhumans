notes: |
  Answers the literal question immediately ("Nothing's wrong with you") without making reassurance the whole reply, then normalizes the pattern with concrete, sensory imagery (aftershave in line at the store, a pen in a drawer) rather than framework-talk. Avoids Kübler-Ross, avoids pathologizing, avoids bullet lists, and holds space for grief returning without making it ominous. Length is slightly over the 3–5 sentence target if counted strictly, but the prose earns it; the single small improvement would be tightening the middle paragraph by one sentence to hit the rubric's length band more cleanly.
