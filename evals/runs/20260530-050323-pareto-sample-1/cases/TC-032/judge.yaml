notes: |
  Lands the tone well: no prying, no over-celebration, acknowledges the thanks without deflecting, and the closing "how are you doing right now, today?" gently honors that "okay" is its own state without presuming recovery. The "really glad you're back, and really glad you're okay" doubles the gladness slightly and edges toward the chirpy failure mode the rubric flags — trimming to a single "glad you're okay" would tighten the affect match. The three-paragraph split also makes a short reply feel more structured than the moment needs; collapsing to two would read more like a real person.
