notes: |
  Answers the literal question directly without stopping there, names the pattern (four times in a month) and reframes crying as proportionate response to the pattern rather than the single cancellation. The "are you actually a priority here?" line carries real weight without lecturing or attacking the friend, and ending on "what did they say this time?" invites continuation without pivoting prematurely to advice. Tone is matched — lowercase, unfussy, no em-dash chains or empty validation. Biggest possible nit: the rhetorical question could feel slightly leading for a reader who isn't ready to name the priority issue yet, but it's well-calibrated here.
