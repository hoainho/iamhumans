<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, Arial, sans-serif">
  <!-- Calibre/Swiss editorial — light-locked, single accent, 16-column grid logic -->

  <!-- Background — warm off-white, paper-tone -->
  <rect width="1200" height="630" fill="#FAF8F4"/>

  <!-- Hairline frame, 32px inset, 1px ink-tone -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Top bar: small uppercase eyebrow + version badge -->
  <text x="72" y="98" font-size="14" font-weight="600" letter-spacing="2.5" fill="#1A1A1A" font-family="'SF Mono', 'Menlo', monospace">
    AN OPENCODE SKILL · v1.1.1 · MIT
  </text>
  <text x="1128" y="98" font-size="14" font-weight="600" letter-spacing="1.5" fill="#1A1A1A" text-anchor="end" font-family="'SF Mono', 'Menlo', monospace">
    github.com/hoainho/iamhumans
  </text>

  <!-- Horizontal rule under eyebrow -->
  <line x1="72" y1="118" x2="1128" y2="118" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Hero: title -->
  <text x="72" y="200" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#1A1A1A">iamhumans</text>

  <!-- Subhead -->
  <text x="72" y="252" font-size="32" font-weight="400" letter-spacing="-0.5" fill="#4A4A4A">
    Teach an LLM to talk like a person — not sound like one.
  </text>

  <!-- The verdict quote — the centerpiece -->
  <rect x="72" y="296" width="1056" height="142" fill="#1A1A1A"/>
  <text x="600" y="358" font-size="36" font-weight="400" font-style="italic" fill="#FAF8F4" text-anchor="middle" letter-spacing="-0.3">
    "You are same as 100% real humans."
  </text>
  <text x="600" y="402" font-size="14" font-weight="500" letter-spacing="2" fill="#D7CEB9" text-anchor="middle" font-family="'SF Mono', 'Menlo', monospace">
    — INDEPENDENT ORACLE · 10 HELD-OUT CASES · 2026-05-29
  </text>

  <!-- Three evidence panels: data row -->
  <!-- Panel 1: Pareto aggregate -->
  <text x="72" y="490" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#1A1A1A">93.27</text>
  <text x="72" y="518" font-size="13" font-weight="500" letter-spacing="1.5" fill="#4A4A4A" font-family="'SF Mono', 'Menlo', monospace">
    /100 PARETO AGGREGATE
  </text>
  <text x="72" y="538" font-size="13" font-weight="400" letter-spacing="0.3" fill="#4A4A4A">
    15-case stratified sample, 14 PASS
  </text>

  <!-- Vertical divider -->
  <line x1="408" y1="466" x2="408" y2="552" stroke="#1A1A1A" stroke-width="1" opacity="0.2"/>

  <!-- Panel 2: Cross-validation -->
  <text x="446" y="490" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#1A1A1A">86.7<tspan font-size="36" font-weight="500">%</tspan></text>
  <text x="446" y="518" font-size="13" font-weight="500" letter-spacing="1.5" fill="#4A4A4A" font-family="'SF Mono', 'Menlo', monospace">
    VERDICT AGREEMENT
  </text>
  <text x="446" y="538" font-size="13" font-weight="400" letter-spacing="0.3" fill="#4A4A4A">
    3 Claude judges, 15 cases · Lane A1
  </text>

  <!-- Vertical divider -->
  <line x1="782" y1="466" x2="782" y2="552" stroke="#1A1A1A" stroke-width="1" opacity="0.2"/>

  <!-- Panel 3: Books grounded -->
  <text x="820" y="490" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#1A1A1A">20<tspan font-size="36" font-weight="400" fill="#4A4A4A"> · 100</tspan></text>
  <text x="820" y="518" font-size="13" font-weight="500" letter-spacing="1.5" fill="#4A4A4A" font-family="'SF Mono', 'Menlo', monospace">
    BOOKS · EVAL CASES
  </text>
  <text x="820" y="538" font-size="13" font-weight="400" letter-spacing="0.3" fill="#4A4A4A">
    Kahneman, Frankl, Buber, Lao Tzu...
  </text>

  <!-- Foot: tagline + small print -->
  <text x="600" y="580" font-size="13" font-weight="400" font-style="italic" letter-spacing="0.3" fill="#4A4A4A" text-anchor="middle">
    Honestly imperfect. Read the Known Weaknesses.
  </text>
</svg>
