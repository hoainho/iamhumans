<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="iamhumans logo — two people leaning together, a spark of connection between them">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0813f"/>
      <stop offset="1" stop-color="#2f6f6a"/>
    </linearGradient>
    <linearGradient id="warm2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f6a"/>
      <stop offset="1" stop-color="#e0813f"/>
    </linearGradient>
  </defs>
  <!-- soft badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#warm)" opacity="0.10"/>
  <!-- left person, leaning right -->
  <g transform="rotate(-9 48 76)">
    <circle cx="48" cy="46" r="16" fill="url(#warm)"/>
    <path d="M22 104 C22 82 34 72 48 72 C62 72 74 82 74 104 Z" fill="url(#warm)"/>
  </g>
  <!-- right person, leaning left -->
  <g transform="rotate(9 80 76)">
    <circle cx="80" cy="46" r="16" fill="url(#warm2)"/>
    <path d="M54 104 C54 82 66 72 80 72 C94 72 106 82 106 104 Z" fill="url(#warm2)"/>
  </g>
  <!-- the spark between them: a word / a moment of being heard -->
  <circle cx="64" cy="40" r="6.5" fill="#fff"/>
  <circle cx="64" cy="40" r="11" fill="none" stroke="#fff" stroke-width="2.2" opacity="0.55"/>
</svg>
